# HealthCloud — local development stack
#
# PostgreSQL (Phase 1) + Kafka in KRaft mode (Phase 8 — the transactional-outbox
# relay publishes integration events here). During day-to-day development the Spring
# Boot app is run locally with `./mvnw spring-boot:run` (fast restarts); the `backend`
# service below (Phase 10, slice 1) runs the app as its production CONTAINER image
# instead — the same artifact AWS ECS Fargate will run later. It is opt-in behind the
# `full` compose profile so the default `up` command is unchanged. Integration tests use
# Testcontainers, not this compose stack, so tests do not need these services running.
#
# Usage:  docker compose up -d postgres kafka            (everyday local dev — app via mvnw)
#         docker compose --profile full up -d postgres backend   (run the backend container)
#         docker compose ps
#         docker compose down          (add -v to also delete the data volume)

services:
  postgres:
    image: postgres:17
    container_name: healthcloud-postgres
    environment:
      POSTGRES_DB: healthcloud
      POSTGRES_USER: ${HEALTHCLOUD_DB_USER:-healthcloud}
      POSTGRES_PASSWORD: ${HEALTHCLOUD_DB_PASSWORD:-healthcloud}
    ports:
      - "5432:5432"
    volumes:
      - healthcloud-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HEALTHCLOUD_DB_USER:-healthcloud} -d healthcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper) — the outbox relay's broker.
  kafka:
    image: apache/kafka:3.9.0
    container_name: healthcloud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node dev defaults (safe to keep low locally).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # The backend as its production container image (Phase 10, slice 1). Opt-in via the `full`
  # profile so `docker compose up -d postgres kafka` (everyday dev) is unaffected. It talks to
  # the `postgres` service over the compose network and waits for it to be healthy first.
  #
  # This slice runs with the DEFAULT Spring profile (production shape): Flyway migrates and the
  # app serves /actuator/health, but there is no demo seed and no dev-login (those are the
  # `local` profile). To get the seeded, clickable app instead, add
  # `SPRING_PROFILES_ACTIVE: local` to the environment below. The outbox relay is disabled here
  # because cross-container Kafka networking is a later slice's concern; the app makes no broker
  # connection at startup regardless.
  backend:
    build: ./backend
    image: healthcloud-backend:local
    container_name: healthcloud-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthcloud
      HEALTHCLOUD_DB_USER: ${HEALTHCLOUD_DB_USER:-healthcloud}
      HEALTHCLOUD_DB_PASSWORD: ${HEALTHCLOUD_DB_PASSWORD:-healthcloud}
      HEALTHCLOUD_AUDIT_HMAC_SECRET: ${HEALTHCLOUD_AUDIT_HMAC_SECRET:-dev-only-audit-hmac-secret-change-me}
      HEALTHCLOUD_OUTBOX_RELAY_ENABLED: "false"
    ports:
      - "8080:8080"

  # The frontend SPA as its production container image (Phase 10, slice 3): a non-root nginx that serves
  # the built static assets and reverse-proxies /api + /actuator to the `backend` service (same-origin, the
  # production mirror of the Vite dev proxy). Opt-in via the `full` profile, like `backend`. Browse the app
  # at http://localhost:8081. For a seeded, logged-in click-through, run the backend on its `local` profile
  # (add SPRING_PROFILES_ACTIVE: local to the `backend` service above).
  frontend:
    build: ./frontend
    image: healthcloud-frontend:local
    container_name: healthcloud-frontend
    profiles: ["full"]
    depends_on:
      - backend
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "8081:8080"

  # --- Observability stack (Phase 11 slice 2) ------------------------------------------------------
  # Local Prometheus + Grafana that scrape the app's /actuator/prometheus and visualise its metrics.
  # Opt-in behind the `observability` profile so everyday `up -d postgres kafka` is unchanged.
  #   docker compose --profile observability up -d prometheus grafana
  # Prometheus scrapes host.docker.internal:8080 — works whether the app runs on the host (mvnw) or as
  # the `backend` container. Grafana auto-provisions the datasource + the "HealthCloud Overview" dashboard.
  #   Prometheus UI: http://localhost:9090      Grafana: http://localhost:3000 (anonymous Viewer)
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: healthcloud-prometheus
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - healthcloud-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # Jaeger all-in-one (Phase 11 slice 3) — the distributed-tracing UI. The app exports spans over OTLP
  # (HTTP :4318 / gRPC :4317, which this image accepts natively); browse traces at http://localhost:16686.
  # In-memory storage (fine for local dev). Opt-in with the same `observability` profile.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: healthcloud-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (the app's default export endpoint)

  grafana:
    image: grafana/grafana:11.4.0
    container_name: healthcloud-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      # Local-only convenience: open the dashboards without a login (Viewer); admin/admin can still edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - healthcloud-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  healthcloud-pgdata:
  healthcloud-prometheus-data:
  healthcloud-grafana-data:
