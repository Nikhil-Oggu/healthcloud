# Prometheus scrape config for the local HealthCloud dev stack (Phase 11 slice 2).
# Runs as a container behind the `observability` compose profile and scrapes the Spring Boot app's
# Micrometer metrics from /actuator/prometheus. The app may run either on the host (via `mvnw
# spring-boot:run`, the everyday path) or as the `backend` container — `host.docker.internal`
# reaches the host from inside the container in both cases (see the extra_hosts mapping in compose).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules (Phase 11 slice 5). Prometheus evaluates these every evaluation_interval and exposes their
# state via /api/v1/rules + /api/v1/alerts (no Alertmanager wired locally — routing is a documented follow-up).
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: healthcloud-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: healthcloud-backend
