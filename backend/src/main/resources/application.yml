spring:
  application:
    name: healthcloud
  servlet:
    multipart:
      # Transport limits for document uploads (§19). Generous vs the app's own logical cap
      # (healthcloud.documents.max-size-bytes) so the service returns a friendly 400 rather than
      # the container rejecting the stream first; MaxUploadSizeExceededException is a 400 backstop.
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcloud
    username: ${HEALTHCLOUD_DB_USER:healthcloud}
    password: ${HEALTHCLOUD_DB_PASSWORD:healthcloud}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway, never auto-generated by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never    # schema is owned by Flyway (V4), not auto-created by Spring Session
  kafka:
    # The broker the outbox relay publishes to (§Phase 8). Local dev uses the docker-compose KRaft node;
    # integration tests use a Testcontainers broker (wired via @ServiceConnection). No @KafkaListener/KafkaAdmin
    # topic beans yet, so the app makes NO broker connection at startup — only the relay connects, when it sends.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # The read side (§Phase 8 slice 3). String payloads; a fresh consumer group reads from the beginning so a
      # newly-deployed consumer still sees earlier events. Listeners start only when the flag below is true.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    # Phase 11 slice 3: propagate the trace context through Kafka headers, so a trace started by an HTTP
    # request continues into the @KafkaListener consumer (the outbox → relay → Kafka → consumer hop).
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8080

healthcloud:
  documents:
    # Where the local-filesystem DocumentStorage stand-in writes bytes (private S3 replaces this in the
    # cloud phase). Git-ignored (var/); override with HEALTHCLOUD_DOCUMENTS_DIR. Tests point this at target/.
    dir: ${HEALTHCLOUD_DOCUMENTS_DIR:./var/documents}
    # The app's own logical upload cap (§19): 10 MiB. Enforced in the service for a clean 400.
    max-size-bytes: 10485760
  anomaly:
    # A claim whose backend-computed total charge exceeds this threshold raises a HIGH_TOTAL_CHARGE anomaly
    # signal (§Phase 6, advanced claims). A synthetic demo heuristic — deterministic and config-driven, not a
    # measured fraud model. Money in dollars.
    high-total-charge-threshold: 5000.00
  audit:
    # Master secret for the tamper-evident audit chain (§Phase 7). The per-organization HMAC key is derived from
    # this (HMAC(secret, orgId)); it lives here in configuration, NOT in the database it protects, so tampering
    # with audit_event rows alone cannot forge a valid fingerprint. This is a local-first dev default — a real
    # deployment holds it in a KMS/HSM (Phase 10), never in plaintext config. Override with HEALTHCLOUD_AUDIT_HMAC_SECRET.
    hmac-secret: ${HEALTHCLOUD_AUDIT_HMAC_SECRET:dev-only-audit-hmac-secret-change-me}
  break-glass:
    # How long a break-glass emergency-access grant stays in force (§Phase 7). Time-boxed on purpose: emergency
    # access is temporary and every grant is audited + reviewable. Minutes. Override with HEALTHCLOUD_BREAK_GLASS_GRANT_DURATION_MINUTES.
    grant-duration-minutes: ${HEALTHCLOUD_BREAK_GLASS_GRANT_DURATION_MINUTES:60}
  retention:
    # Data retention (§Phase 7): how long an EXPIRED break-glass grant is kept before an admin purge removes it,
    # in days. The grant holds the sensitive free-text emergency reason; once it is long expired and reviewed, the
    # reason no longer needs to live in the database. The audit trail is NEVER purged (its BREAK_GLASS_INVOKED /
    # REVOKED events are permanent) — only this operational row is. Override with HEALTHCLOUD_RETENTION_BREAK_GLASS_DAYS.
    break-glass-days: ${HEALTHCLOUD_RETENTION_BREAK_GLASS_DAYS:90}
  outbox:
    relay:
      # The transactional-outbox relay (§Phase 8): a scheduled poller that publishes pending outbox_event rows to
      # Kafka AFTER their domain transaction has committed, then stamps published_at. Enabled for local dev + prod;
      # the test suite disables it (src/test/resources/application-local.yml) and drives the relay directly.
      enabled: ${HEALTHCLOUD_OUTBOX_RELAY_ENABLED:true}
      poll-interval-ms: ${HEALTHCLOUD_OUTBOX_RELAY_POLL_INTERVAL_MS:2000}
      batch-size: ${HEALTHCLOUD_OUTBOX_RELAY_BATCH_SIZE:100}
      send-timeout-ms: ${HEALTHCLOUD_OUTBOX_RELAY_SEND_TIMEOUT_MS:5000}
    health:
      # The OutboxHealthIndicator (Phase 11 slice 4) reports OUT_OF_SERVICE on the root /actuator/health when more
      # than this many events are pending (the relay is stuck/behind) — an operator/alert signal only; it does NOT
      # affect the readiness probe, so a backlog never pulls the pod from the load balancer. When the relay is
      # disabled a backlog is expected, so the indicator stays UP regardless of this threshold.
      max-pending: ${HEALTHCLOUD_OUTBOX_HEALTH_MAX_PENDING:500}
  deadletter:
    replay:
      # How long an ORG_ADMIN's dead-letter replay (§Phase 8 slice 6) waits for the synchronous re-publish to the
      # source topic before failing (leaving the record un-stamped so it can be retried).
      send-timeout-ms: ${HEALTHCLOUD_DEADLETTER_REPLAY_SEND_TIMEOUT_MS:5000}
  kafka:
    consumers:
      # Whether the @KafkaListener read-side consumers auto-start (§Phase 8 slice 3). Enabled for local dev + prod;
      # the broker-free test suite disables it (src/test/resources/application-local.yml) and the consumer test
      # re-enables it against a Testcontainers broker.
      enabled: ${HEALTHCLOUD_KAFKA_CONSUMERS_ENABLED:true}
      retry:
        # Consumer retry + dead-letter handling (§Phase 8 slice 4). A failing record is retried up to max-attempts
        # deliveries, backoff-ms apart; then it is parked on <topic>.DLT. Structural failures (bad header/payload)
        # skip retries and go straight to the DLT.
        max-attempts: ${HEALTHCLOUD_KAFKA_CONSUMERS_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${HEALTHCLOUD_KAFKA_CONSUMERS_RETRY_BACKOFF_MS:500}

logging:
  pattern:
    # Attach the per-request correlation id (from CorrelationIdFilter's MDC) plus the tracing ids
    # (Phase 11 slice 3 — Micrometer Tracing populates traceId/spanId in the MDC), so a log line ties
    # both to the X-Correlation-Id returned to the client AND to its distributed trace in Jaeger.
    level: "%5p [cid=%X{correlationId:-} trace=%X{traceId:-}/%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        # health + info are public (see SecurityConfig); prometheus + metrics require auth (the
        # default for non-health actuator paths) — a local scraper authenticates or scrapes internally.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Component details (e.g. the `db` status + any connection exception text) are shown ONLY to an
      # authorized caller (Phase 11 review fix). `/actuator/health` + `/actuator/health/**` are public
      # (SecurityConfig) and, on the deployed app, reachable through nginx→CloudFront — so an anonymous
      # caller must see `{"status":"UP"}` only, never internals. The `local` profile overrides this back
      # to `always` (see the profile document at the end of this file) for dev convenience — local is not public.
      show-details: when-authorized
      probes:
        enabled: true          # expose /actuator/health/liveness + /actuator/health/readiness (Phase 11 slice 4)
      group:
        # Readiness ("can I serve traffic?") = the app's own readiness state PLUS the database, so the pod is taken
        # out of the load balancer when Postgres is unreachable (Phase 11 slice 4). Liveness keeps its default
        # (livenessState only) — an external dependency blip must NEVER restart the process. The outbox indicator is
        # deliberately left OUT of both probes (a relay backlog doesn't stop serving requests); it shows on the root
        # /actuator/health aggregate only.
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: healthcloud     # a common label on every metric (Phase 11 slice 1)
    distribution:
      percentiles-histogram:
        # Publish latency histogram buckets for HTTP requests so Prometheus/Grafana can compute
        # percentiles (e.g. p95 via histogram_quantile). Phase 11 slice 2.
        http.server.requests: true
  # Phase 11 slice 3 — distributed tracing. Sample everything locally so every request shows up in
  # Jaeger (a real production deployment would sample a small fraction). Spans are exported over OTLP;
  # the default endpoint is a local Jaeger (override with MANAGEMENT_OTLP_TRACING_ENDPOINT). The
  # deployed app has no collector wired yet, so export simply no-ops there (documented follow-up).
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4.1's OTLP tracing endpoint property (renamed from the Boot-3 `management.otlp.tracing.endpoint`).
          # Points at the local Jaeger OTLP/HTTP receiver; override with MANAGEMENT_OTLP_TRACING_ENDPOINT.
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
---
# Local-profile overrides (Phase 11 review fix). The `local` profile is developer-only and never public, so
# it restores full health-component detail for convenient debugging. The deployed `demo,cognito` app keeps the
# hardened `when-authorized` default above, so an anonymous CloudFront visitor sees only `{"status":"UP"}`.
spring:
  config:
    activate:
      on-profile: local
management:
  endpoint:
    health:
      show-details: always
