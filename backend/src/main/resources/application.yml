spring:
  application:
    name: healthcloud
  servlet:
    multipart:
      # Transport limits for document uploads (§19). Generous vs the app's own logical cap
      # (healthcloud.documents.max-size-bytes) so the service returns a friendly 400 rather than
      # the container rejecting the stream first; MaxUploadSizeExceededException is a 400 backstop.
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcloud
    username: ${HEALTHCLOUD_DB_USER:healthcloud}
    password: ${HEALTHCLOUD_DB_PASSWORD:healthcloud}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway, never auto-generated by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never    # schema is owned by Flyway (V4), not auto-created by Spring Session

server:
  port: 8080

healthcloud:
  documents:
    # Where the local-filesystem DocumentStorage stand-in writes bytes (private S3 replaces this in the
    # cloud phase). Git-ignored (var/); override with HEALTHCLOUD_DOCUMENTS_DIR. Tests point this at target/.
    dir: ${HEALTHCLOUD_DOCUMENTS_DIR:./var/documents}
    # The app's own logical upload cap (§19): 10 MiB. Enforced in the service for a clean 400.
    max-size-bytes: 10485760
  anomaly:
    # A claim whose backend-computed total charge exceeds this threshold raises a HIGH_TOTAL_CHARGE anomaly
    # signal (§Phase 6, advanced claims). A synthetic demo heuristic — deterministic and config-driven, not a
    # measured fraud model. Money in dollars.
    high-total-charge-threshold: 5000.00
  audit:
    # Master secret for the tamper-evident audit chain (§Phase 7). The per-organization HMAC key is derived from
    # this (HMAC(secret, orgId)); it lives here in configuration, NOT in the database it protects, so tampering
    # with audit_event rows alone cannot forge a valid fingerprint. This is a local-first dev default — a real
    # deployment holds it in a KMS/HSM (Phase 10), never in plaintext config. Override with HEALTHCLOUD_AUDIT_HMAC_SECRET.
    hmac-secret: ${HEALTHCLOUD_AUDIT_HMAC_SECRET:dev-only-audit-hmac-secret-change-me}
  break-glass:
    # How long a break-glass emergency-access grant stays in force (§Phase 7). Time-boxed on purpose: emergency
    # access is temporary and every grant is audited + reviewable. Minutes. Override with HEALTHCLOUD_BREAK_GLASS_GRANT_DURATION_MINUTES.
    grant-duration-minutes: ${HEALTHCLOUD_BREAK_GLASS_GRANT_DURATION_MINUTES:60}
  retention:
    # Data retention (§Phase 7): how long an EXPIRED break-glass grant is kept before an admin purge removes it,
    # in days. The grant holds the sensitive free-text emergency reason; once it is long expired and reviewed, the
    # reason no longer needs to live in the database. The audit trail is NEVER purged (its BREAK_GLASS_INVOKED /
    # REVOKED events are permanent) — only this operational row is. Override with HEALTHCLOUD_RETENTION_BREAK_GLASS_DAYS.
    break-glass-days: ${HEALTHCLOUD_RETENTION_BREAK_GLASS_DAYS:90}

logging:
  pattern:
    # Attach the per-request correlation id (from CorrelationIdFilter's MDC) to every log line,
    # so a log entry can be tied to the X-Correlation-Id returned to the client.
    level: "%5p [cid=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always     # dev: show component health (db, etc.). Tightened later for prod.
      probes:
        enabled: true
  health:
    db:
      enabled: true
