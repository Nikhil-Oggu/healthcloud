# Test-only override (Phase 8 slice 2). Integration tests run under @ActiveProfiles("local"); this file lives on
# the TEST classpath only (there is no application-local.yml in main), so it augments — never shadows — the main
# application.yml. It disables the scheduled outbox relay for the whole suite: the general tests have no Kafka
# broker, and the relay test drives OutboxRelay.publishPending() directly (against a Testcontainers broker) rather
# than waiting on the timer.
healthcloud:
  outbox:
    relay:
      enabled: false
  kafka:
    consumers:
      # Keep the @KafkaListener read-side consumers stopped in the broker-free suite; the consumer integration
      # test re-enables them (@SpringBootTest properties) against a Testcontainers broker.
      enabled: false

# Phase 11 slice 3: disable distributed tracing in the test suite — there is no OTLP collector in CI, so
# exporting spans would just log connection failures. Tracing is exercised manually against a local Jaeger.
management:
  tracing:
    enabled: false
