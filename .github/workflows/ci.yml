name: CI

# CI pipeline. Proves both halves of the app build and pass their tests on every push and pull
# request to main, before anything is trusted. Independent jobs so a frontend failure doesn't mask
# a backend pass (and vice versa). Phase 10 slice 2 adds a third job that builds the backend
# container image on every change and PUBLISHES it to GHCR on pushes to main — the versioned,
# pullable artifact a cloud deploy (AWS ECS Fargate) will later pull. Free: GHCR is built into the
# repo and authenticates with the automatic GITHUB_TOKEN; no image is deployed anywhere here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes) to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 · Maven · Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # GitHub-hosted ubuntu runners ship Docker, so the Testcontainers-backed tests
      # (real PostgreSQL 17) run unchanged — no service container wiring needed.
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend (Node 24 · Vitest · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Build the backend container image on every change (proving the Dockerfile still builds), and
  # PUBLISH it to GHCR only on pushes to main. Runs after `backend`, so we never publish an image
  # whose tests didn't pass. On pull requests it builds but does NOT push (fork PRs can't push to
  # GHCR, and we don't publish unreviewed images). Phase 10 slice 2.
  backend-image:
    name: Backend image (Docker · GHCR)
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write        # push to GHCR via the automatic GITHUB_TOKEN — no secrets to configure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed when we actually push (skipped on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags/labels. metadata-action lowercases the image name (GHCR requires it).
      # On main: an immutable sha-<short> tag (what a deploy pins to) + a moving `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/healthcloud-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64        # the ECS Fargate default; multi-arch (arm64) is a follow-up
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache the (slow) Maven-dependency layer across runs so rebuilds are fast. A distinct scope
          # keeps this cache from colliding with the frontend image build's cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Build the frontend container image on every change, and PUBLISH it to GHCR only on pushes to main.
  # Mirrors backend-image: runs after `frontend`, so we never publish an image whose tests/typecheck/build
  # didn't pass; on pull requests it builds but does NOT push. Phase 10 slice 4.
  frontend-image:
    name: Frontend image (Docker · GHCR)
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write        # push to GHCR via the automatic GITHUB_TOKEN — no secrets to configure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed when we actually push (skipped on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags/labels. metadata-action lowercases the image name (GHCR requires it).
      # On main: an immutable sha-<short> tag (what a deploy pins to) + a moving `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/healthcloud-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64        # the ECS Fargate default; multi-arch (arm64) is a follow-up
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Distinct scope so this cache doesn't collide with the backend image build's cache.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
